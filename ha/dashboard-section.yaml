# The Pool Heater dashboard section (sections view, 12-column grid).
# Adjust entity IDs if yours differ. The Fault tile uses the latched
# sensor.pool_heater_fault from ha/templates.yaml (the raw tuya-local
# fault-code sensor pulses during faults; the latched wrapper doesn't).
type: grid
cards:
  - type: heading
    heading: Pool Heater
    heading_style: title
    icon: mdi:pool
  - type: tile
    entity: input_number.pool_heater_setpoint_f
    name: Setpoint
    features:
      - type: numeric-input
        style: buttons
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.pool_heater_water_temp
    name: Heat Exchanger
    grid_options:
      columns: 6
  - type: tile
    entity: climate.pool_heater
    name: Mode
    state_content:
      - state
    features:
      - type: climate-hvac-modes
      - type: climate-preset-modes
        style: dropdown
    grid_options:
      columns: 12
  - type: tile
    entity: sensor.pool_heater_fault
    name: Fault
    state_content:
      - state
      - description
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.pool_heater_running_percentage
    name: Running
    grid_options:
      columns: 6
  - type: tile
    entity: sensor.pool_heater_setpoint_verify
    name: Last Verify
    state_content:
      - state
      - last_updated
    grid_options:
      columns: 6
  # A tile, not a button: button cards refuse to render at single-row
  # height, and the tile matches the rest of the section.
  - type: tile
    entity: script.pool_heater_verify_setpoint
    name: Verify Setpoint
    icon: mdi:sync-alert
    hide_state: true
    tap_action:
      action: toggle
    icon_tap_action:
      action: toggle
    grid_options:
      columns: 6
