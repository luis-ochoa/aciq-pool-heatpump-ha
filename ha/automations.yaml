# The keeper's two automations. Add them however your install loads
# automations (automations.yaml, an !include_dir, or paste via the UI's
# YAML editor). See GUIDE.md.

- id: pool_heater_setpoint_writer
  alias: Pool Heater — push °F setpoint to unit
  description: >-
    Writes the keeper input_number raw into dp2 whenever it changes (the unit
    in °F display mode interprets dp2 writes as integer °F). Also re-asserts
    on HA start in case the unit power-cycled while HA was down. mode:restart
    + the short delay debounce rapid +/- taps into one write.
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_number.pool_heater_setpoint_f
      not_from:
        - unknown
        - unavailable
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:00:02"
    - action: shell_command.pool_heater_set_f
      data:
        f: "{{ states('input_number.pool_heater_setpoint_f') | int }}"

- id: pool_heater_setpoint_verify_schedule
  alias: Pool Heater — scheduled setpoint verify
  description: >-
    Closed-loop verify every hour on the hour. Catches wall-display edits,
    and caps the exposure after a power blip reverts the display to °C at
    60 min. The unit display blinks °C for ~10 s each run. Prefer fewer
    runs? Swap in a time trigger with fixed times inside your pump window.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: 0
  actions:
    - action: script.pool_heater_verify_setpoint
